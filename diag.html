<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Diagnostic Cabine</title></head>
<body style="background:#111;color:#eee;font:13px monospace">
<pre id="out">démarrage…</pre>
<script type="module">
const out=document.getElementById('out'); const lines=[]; const t0=performance.now();
const log=(...a)=>{ lines.push(((performance.now()-t0)/1000).toFixed(1)+'s '+a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ')); out.textContent=lines.join('\n'); };
window.addEventListener('error',e=>log('ONERROR',String(e.message)));
window.addEventListener('unhandledrejection',e=>log('UNHANDLED',String(e.reason&&e.reason.message||e.reason)));
const URLS={v1:'https://cdn.jsdelivr.net/npm/@gradio/client@1.19.1/dist/browser.js',v2:'https://cdn.jsdelivr.net/npm/@gradio/client@2.7.1/dist/browser.js'};
async function img(url){ const r=await fetch(url); if(!r.ok) throw new Error('img '+r.status); return await r.blob(); }
async function probe(tag,url,opts){
  try{ const r=await fetch(url,opts); log(tag,'probe',url.replace(/^https:\/\//,''),r.status,r.headers.get('access-control-allow-origin')); }
  catch(e){ log(tag,'probe ÉCHEC',url.replace(/^https:\/\//,''),String(e.message)); }
}
async function run(tag,ver,space,steps){
  const m=await import(URLS[ver]);
  const t=performance.now(); log(tag,ver,'connect…');
  const c=await m.Client.connect(space,{events:['data','status','log']});
  log(tag,'connecté en',((performance.now()-t)/1000).toFixed(1)+'s');
  const sub=async(ep,data)=>{
    const h=c.submit(ep,data); let last='';
    for await (const msg of h){
      if(msg.type==='status'){
        const s=JSON.stringify({stage:msg.stage,pos:msg.position,msg:msg.message,title:msg.title,prog:msg.progress_data&&msg.progress_data.map(p=>(p.desc||'')+(p.length?':'+Math.round(10*p.index/p.length)*10+'%':''))});
        if(s!==last){ log(tag,ep,'status',s); last=s; }
      }
      else if(msg.type==='log') log(tag,ep,'log',{level:msg.level,log:msg.log});
      else if(msg.type==='data'){ log(tag,ep,'DATA',JSON.stringify(msg.data).slice(0,200)); return msg.data; }
      if(msg.type==='status' && msg.stage==='error') throw new Error((msg.title||'')+' '+(msg.message||'error'));
    }
    throw new Error('flux terminé sans données');
  };
  return steps(sub);
}
function cap(p,ms,tag){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('DÉLAI DÉPASSÉ '+ms/1000+'s')),ms))]).catch(e=>log(tag,'ÉCHEC',String(e&&e.message||e))); }
const base='https://huggingface.co/spaces/BoyuanJiang/FitDiT/resolve/main/examples/';
(async()=>{
  let person,garm;
  try{ person=await img(base+'model/0279.jpg'); garm=await img(base+'garment/0.jpg'); log('images',person.size,garm.size); }
  catch(e){ log('images ÉCHEC',String(e)); return; }
  const q=new URLSearchParams(location.search);
  const which=(q.get('e')||'probe,fitdit2,leffa2,qwen1').split(',');
  const limit=Number(q.get('t')||50)*1000;
  const jobs=[];
  if(which.includes('probe')) jobs.push((async()=>{
    for(const [tag,id,host] of [['FITDIT','BoyuanJiang/FitDiT','https://boyuanjiang-fitdit.hf.space'],['LEFFA','franciszzj/Leffa','https://franciszzj-leffa.hf.space']]){
      await probe(tag,'https://huggingface.co/api/spaces/'+id+'/host');
      await probe(tag,host+'/config');
      await probe(tag,host+'/gradio_api/info');
      await probe(tag,host+'/info');
      await probe(tag,host+'/gradio_api/info?serialize=False');
    }
  })());
  if(which.includes('fitdit2')) jobs.push(cap(run('FITDIT','v2','BoyuanJiang/FitDiT',async sub=>{
    const m=await sub('/generate_mask',[person,'Upper-body',0,0,0,0]);
    await sub('/process',[person,garm,m[0],m[1],20,2,-1,1,'768x1024']); log('FITDIT','TERMINÉ');
  }),limit,'FITDIT'));
  if(which.includes('leffa2')) jobs.push(cap(run('LEFFA','v2','franciszzj/Leffa',async sub=>{
    await sub('/leffa_predict_vt',[person,garm,false,30,2.5,42,'viton_hd','upper_body',false]); log('LEFFA','TERMINÉ');
  }),limit,'LEFFA'));
  if(which.includes('idm2')) jobs.push(cap(run('IDM','v2','yisol/IDM-VTON',async sub=>{
    await sub('/tryon',[{background:person,layers:[],composite:null},garm,'top',true,true,30,42]); log('IDM','TERMINÉ');
  }),limit,'IDM'));
  if(which.includes('idm1')) jobs.push(cap(run('IDM','v1','yisol/IDM-VTON',async sub=>{
    await sub('/tryon',[{background:person,layers:[],composite:null},garm,'top',true,true,30,42]); log('IDM','TERMINÉ');
  }),limit,'IDM'));
  if(which.includes('qwen1')) jobs.push(cap(run('QWEN1','v2','linoyts/Qwen-Image-Edit-2511-Fast',async sub=>{
    await sub('/infer',[[{image:person,caption:null}],'Change the color of the top to red.',0,true,1,4,1024,768,false]); log('QWEN1','TERMINÉ');
  }),limit,'QWEN1'));
  if(which.includes('qwen2')) jobs.push(cap(run('QWEN2','v2','linoyts/Qwen-Image-Edit-2511-Fast',async sub=>{
    await sub('/infer',[[{image:person,caption:null},{image:garm,caption:null}],'Make the person in image 1 wear the top from image 2.',0,true,1,4,1024,768,false]); log('QWEN2','TERMINÉ');
  }),limit,'QWEN2'));
  if(which.includes('weshop')) jobs.push(cap(run('WESHOP','v2','WeShopAI/WeShopAI-Virtual-Try-On',async sub=>{
    const d=await sub('/generate_image',[garm,person]); log('WESHOP','TERMINÉ');
  }),limit,'WESHOP'));
  if(which.includes('prith')) jobs.push(cap(run('PRITH','v2','prithivMLmods/Qwen-Image-Edit-2511-LoRAs-Fast',async sub=>{
    const b64=b=>new Promise(r=>{const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b);});
    const s=await sub('/check_safety',['Make the person in image 1 wear the top from image 2.']); 
    const d=await sub('/edit_image',[JSON.stringify([await b64(person),await b64(garm)]),'Make the person in image 1 wear the top from image 2. Keep everything else unchanged.',q.get('lora')||'Unblur-Anything',0,true,1,4]);
    log('PRITH','TERMINÉ',d && d[0] && Object.keys(d[0]), d && d[0] && d[0].status, d && d[0] && String(d[0].image||'').slice(0,40));
  }),limit,'PRITH'));
  await Promise.all(jobs);
  log('FIN DU DIAGNOSTIC');
})();
</script>
</body></html>
