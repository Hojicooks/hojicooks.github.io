<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thaïlande">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Thaïlande · version téléphone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<script src="../vendor/leaflet/leaflet.js"></script>
<style>
:root {
  --night: #0E2233; --night-2: #17324A; --paper: #F6F0E4; --card: #FFFFFF; --ink: #1E2833; --muted: #5F6B74; --line: #E4D9C5;
  --saffron: #E38A22; --go: #23905F; --go-soft: #E3F4EA; --no: #B4465C; --no-soft: #F8E4E9; --maybe: #B7860B; --maybe-soft: #FBF1D6;
  --field: #FFFFFF; --soft: #F1EADC; --new: #E91E63;
  --font-display: "Mitr", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Sarabun", "Segoe UI", system-ui, sans-serif;
  --nav-h: 64px; --safe-b: env(safe-area-inset-bottom); --safe-t: env(safe-area-inset-top);
  color-scheme: light;
}
html[data-theme="lagon"] { --night: #0B3A47; --night-2: #12505F; --paper: #EDF6F5; --line: #CBE1DE; --saffron: #2EC4B6; --muted: #4F6B73; --soft: #E1EFED; }
html[data-theme="jungle"] { --night: #15301F; --night-2: #1F4630; --paper: #F1F4EA; --line: #D5DFC7; --saffron: #F2B33D; --muted: #5B6957; --soft: #E6ECDC; }
html[data-theme="sunset"] { --night: #3B1D33; --night-2: #56284B; --paper: #FCF1EC; --line: #EED5CB; --saffron: #FF8A65; --muted: #73606A; --soft: #F6E4DC; }
html[data-theme="orchid"] { --night: #2A1E4A; --night-2: #3C2C68; --paper: #F5F1FA; --line: #E0D6EE; --saffron: #E879A9; --muted: #655D76; --soft: #EBE4F5; }
html[data-theme="nuit"] {
  color-scheme: dark;
  --paper: #0F1A24; --card: #172532; --field: #1F2F3E; --ink: #E7EEF3; --muted: #9FB1BE; --line: #2C3E4E; --soft: #1C2B38;
  --night: #08121A; --night-2: #142330; --saffron: #F0A040; --go-soft: #173A2B; --maybe-soft: #3A3219; --no-soft: #3C1F28;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.45 var(--font-body); padding-bottom: calc(var(--nav-h) + var(--safe-b)); overflow-x: hidden; }
body.noscroll { overflow: hidden; }
h1, h2, h3, b { font-family: var(--font-display); font-weight: 500; }
h1, h2, h3, p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
svg.i, svg.fb-i { width: 1.15em; height: 1.15em; fill: currentColor; flex: none; }
#app { max-width: 620px; margin: 0 auto; min-height: 100vh; }
.scr { padding: calc(10px + var(--safe-t)) 14px 24px; display: grid; gap: 14px; min-width: 0; }
.scr > * { min-width: 0; }

/* en-têtes */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 6px; }
.top h1 { font-size: 2rem; line-height: 1.1; color: var(--night); }
html[data-theme="nuit"] .top h1 { color: var(--ink); }
.top.slim h1 { font-size: 1.6rem; }
.top p { color: var(--muted); font-size: .92rem; }
.syncdot { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; flex: none; }
.syncdot i { width: 9px; height: 9px; border-radius: 50%; background: #9AA6AF; }
.syncdot.ok i { background: var(--go); } .syncdot.busy i { background: var(--saffron); } .syncdot.err i { background: var(--no); }
.sec { font-size: 1.15rem; color: var(--ink); margin-top: 6px; }
.hint { color: var(--muted); font-size: .85rem; margin-top: -4px; }
.muted { color: var(--muted); }

/* aujourd'hui */
.today { display: grid; gap: 10px; background: var(--night); color: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: 0 10px 28px rgba(0,0,0,.18); }
.today.pre { grid-template-columns: auto 1fr auto; align-items: center; }
.td-ic { width: 46px; height: 46px; border-radius: 14px; background: var(--saffron); color: var(--night); display: grid; place-items: center; }
.td-ic svg { width: 26px; height: 26px; }
.td-t { display: grid; } .td-t b { font-size: 1.2rem; } .td-t small, .td-h small { opacity: .8; }
.td-h { display: grid; } .td-h b { font-size: 1.35rem; }
.td-l { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.td-l li { display: flex; gap: 10px; align-items: baseline; }
.td-l .tm { min-width: 44px; font-weight: 700; color: var(--saffron); }
.td-free { opacity: .85; }
.td-more { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--saffron); }
.newbar { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: var(--card); border: 1.5px solid #F2B8CB; }
.newbar .nb-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--new); color: #fff; display: grid; place-items: center; }
.newbar span:nth-child(2) { display: grid; } .newbar small { color: var(--muted); }

/* cartes d'étapes */
.stglist { display: grid; gap: 12px; }
.stg { position: relative; display: block; height: 148px; border-radius: 22px; overflow: hidden; background: var(--night-2); box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.stg > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.stg-in { position: absolute; inset: 0; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: 6px 12px; align-items: end; color: #fff; background: linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(0,0,0,.72)); }
.stg-n { grid-row: 1; align-self: start; width: 34px; height: 34px; border-radius: 50%; background: var(--saffron); color: var(--night); display: grid; place-items: center; font-weight: 800; font-family: var(--font-display); }
.stg-t { grid-column: 1 / -1; display: grid; } .stg-t b { font-size: 1.45rem; line-height: 1.15; } .stg-t small { opacity: .9; }
.stg-c { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.cn { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 999px; font-size: .82rem; font-weight: 700; background: rgba(255,255,255,.92); color: var(--ink); }
.cn.go { color: var(--go); } .cn.maybe { color: var(--maybe); } .cn.todo { background: rgba(0,0,0,.45); color: #fff; font-weight: 600; }

/* barre d'une étape */
.bar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin: calc(-10px - var(--safe-t)) -14px 0; padding: calc(8px + var(--safe-t)) 10px 8px; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar-t { display: grid; min-width: 0; } .bar-t b { font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bar-t small { color: var(--muted); font-size: .8rem; }
.ib { min-width: 42px; height: 42px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); display: inline-grid; place-items: center; color: var(--ink); }
.ib svg { width: 24px; height: 24px; }
.ib.pill { display: inline-flex; gap: 6px; padding: 0 14px; font-weight: 600; background: var(--night); color: #fff; border: 0; }
.ib.pill svg { width: 20px; height: 20px; }
.ib[disabled] { opacity: .35; }
.shero { position: relative; height: 150px; border-radius: 20px; overflow: hidden; background: var(--night-2); }
.shero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shero-in { position: absolute; inset: 0; display: grid; align-content: end; gap: 6px; padding: 14px; color: #fff; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.72)); }
.shero-in p { font-size: .9rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stay { display: inline-flex; align-items: center; gap: 6px; justify-self: start; max-width: 100%; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); font-size: .82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stay.off { background: rgba(0,0,0,.45); color: #fff; font-weight: 500; }

/* puces de filtre */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px; scrollbar-width: none; scroll-snap-type: x proximity; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-size: .92rem; font-weight: 600; white-space: nowrap; scroll-snap-align: start; }
.chip em { font-style: normal; font-size: .78rem; padding: 0 7px; border-radius: 999px; background: var(--soft); color: var(--muted); }
.chip.on { background: var(--night); border-color: var(--night); color: #fff; }
.chip.on em { background: rgba(255,255,255,.2); color: #fff; }
.chip.f-go:not(.on) svg { fill: var(--go); } .chip.f-maybe:not(.on) svg { fill: var(--maybe); } .chip.f-no:not(.on) svg { fill: var(--no); }
.chip.f-new:not(.on) { color: var(--new); border-color: #F2B8CB; }
.chips.cats .chip { height: 34px; font-weight: 500; font-size: .86rem; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }

/* cartes de lieux */
.plist { display: grid; gap: 10px; }
.pc { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 12px; padding: 8px; border-radius: 18px; background: var(--card); border: 1.5px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.pc.s-go { border-color: color-mix(in srgb, var(--go) 45%, transparent); }
.pc.s-maybe { border-color: color-mix(in srgb, var(--maybe) 45%, transparent); }
.pc.s-no { opacity: .7; }
.pc-ph-w { position: relative; }
.pc-ph, .sh-img, .tc-img, .tl-ph, .fr-ph { position: relative; display: grid; place-items: center; overflow: hidden; background: linear-gradient(135deg, var(--c), var(--night)); color: #fff; }
.pc-ph { width: 104px; height: 104px; border-radius: 14px; }
.pc-ph img, .sh-img img, .tc-img img, .tl-ph img, .fr-ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pc-ph .fb-i { width: 34px; height: 34px; opacity: .9; }
.pc-st { position: absolute; left: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.pc-st svg { width: 17px; height: 17px; }
.s-go .pc-st { background: var(--go); } .s-maybe .pc-st { background: var(--maybe); } .s-no .pc-st { background: var(--no); }
.pc-new { position: absolute; left: 6px; top: 6px; padding: 1px 7px; border-radius: 999px; background: var(--new); color: #fff; font: 700 .66rem/1.6 var(--font-body); letter-spacing: .08em; }
.pc-new.in { position: static; margin-left: 6px; }
.pc-tx { display: grid; align-content: start; gap: 3px; min-width: 0; }
.pc-tx > b { font-size: 1.02rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.pc-tx small { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; color: var(--muted); font-size: .82rem; min-width: 0; }
.pc-tx .km { display: inline-flex; align-items: center; gap: 3px; }
.pc-tx .km::before { content: "·"; margin-right: 2px; }
.when-s { color: var(--go) !important; font-weight: 600; }
.qa { display: flex; gap: 6px; margin-top: 4px; }
.q { width: 40px; height: 36px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--field); display: grid; place-items: center; }
.q svg { width: 20px; height: 20px; }
.q-go svg { fill: var(--go); } .q-maybe svg { fill: var(--maybe); } .q-no svg { fill: var(--no); }
.q-go.on { background: var(--go); border-color: var(--go); } .q-maybe.on { background: var(--maybe); border-color: var(--maybe); } .q-no.on { background: var(--no); border-color: var(--no); }
.q.on svg { fill: #fff; }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 34px 16px; border: 1.5px dashed var(--line); border-radius: 20px; }
.empty svg { width: 38px; height: 38px; fill: var(--muted); }
.empty.big { padding: 60px 20px; } .empty.big svg { width: 54px; height: 54px; fill: var(--saffron); }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 16px; border: 0; background: var(--night); color: #fff; font-weight: 600; }
.btn svg { width: 20px; height: 20px; }
.btn.soft { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn.wide { width: 100%; }
.btn.ig { background: linear-gradient(135deg, #F58529, #DD2A7B 55%, #8134AF); }
.lnk { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 8px 0; color: var(--night); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
html[data-theme="nuit"] .lnk { color: var(--saffron); }
.lnk svg { width: 18px; height: 18px; }
.lnk[disabled] { opacity: .35; }

/* carte */
.scr.is-map { gap: 10px; }
.mapwrap { position: relative; margin: 0 -14px; }
.mmap { height: calc(100dvh - var(--nav-h) - var(--safe-b) - 190px); min-height: 320px; background: #DDE5EA; }
.map-fit { position: absolute; right: 12px; top: 12px; z-index: 500; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--card); box-shadow: 0 4px 12px rgba(0,0,0,.2); display: grid; place-items: center; }
.map-fit svg { width: 22px; height: 22px; fill: var(--ink); }
.map-hint { position: absolute; left: 12px; bottom: 26px; z-index: 500; background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 999px; font-size: .82rem; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
.mk-w { background: none; border: 0; }
.mk { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.mk svg { width: 17px; height: 17px; fill: #fff; }
.mk.s-go { border-color: #23905F; box-shadow: 0 0 0 3px #23905F; } .mk.s-maybe { border-color: #fff; box-shadow: 0 0 0 3px #B7860B; }
.mk.home { width: 38px; height: 38px; background: #0E2233; border-radius: 12px; }
.mk.home svg { width: 22px; height: 22px; }

/* fiche (panneau du bas) */
#sheet { position: fixed; inset: 0; z-index: 60; }
#sheet[hidden] { display: none; }
.sh-back { position: absolute; inset: 0; background: rgba(8, 18, 26, .5); animation: fadein .2s; }
.sh-card { position: absolute; left: 0; right: 0; bottom: 0; max-width: 620px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--card); border-radius: 24px 24px 0 0; padding-bottom: calc(16px + var(--safe-b)); animation: up .25s ease-out; transition: transform .2s; }
@keyframes up { from { transform: translateY(40%); opacity: .4; } }
@keyframes fadein { from { opacity: 0; } }
.sh-ph { position: relative; }
.sh-img { height: 230px; border-radius: 24px 24px 0 0; }
.sh-img .fb-i { width: 60px; height: 60px; }
.grab { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 44px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.85); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.sh-x { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; }
.sh-x svg { width: 22px; height: 22px; }
.sh-in { padding: 16px 18px 6px; display: grid; gap: 14px; }
.sh-in h2 { font-size: 1.5rem; line-height: 1.15; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -6px; }
.fact { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--soft); font-size: .85rem; font-weight: 600; }
.fact svg { width: 16px; height: 16px; }
.fact.new { background: var(--new); color: #fff; }
.big3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.b3 { display: grid; justify-items: center; gap: 4px; padding: 12px 4px; border-radius: 18px; border: 1.5px solid var(--line); background: var(--field); font-weight: 600; font-size: .86rem; line-height: 1.15; text-align: center; }
.b3 svg { width: 26px; height: 26px; }
.b3-go svg { fill: var(--go); } .b3-maybe svg { fill: var(--maybe); } .b3-no svg { fill: var(--no); }
.b3-go.on { background: var(--go); border-color: var(--go); color: #fff; } .b3-maybe.on { background: var(--maybe); border-color: var(--maybe); color: #fff; } .b3-no.on { background: var(--no); border-color: var(--no); color: #fff; }
.b3.on svg { fill: #fff; }
.when { display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--soft); }
.when h3 { font-size: 1rem; }
.days { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px; }
.days::-webkit-scrollbar { display: none; }
.dchip { flex: none; display: grid; justify-items: center; width: 58px; padding: 6px 0; border-radius: 14px; border: 1.5px solid var(--line); background: var(--field); line-height: 1.15; }
.dchip b { font-size: 1.25rem; } .dchip small { font-size: .72rem; color: var(--muted); }
.dchip.on { background: var(--night); border-color: var(--night); color: #fff; } .dchip.on small { color: rgba(255,255,255,.75); }
.times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tm-in { display: grid; gap: 2px; font-size: .78rem; color: var(--muted); font-weight: 600; min-width: 0; }
.tm-in input { -webkit-appearance: none; appearance: none; width: 100%; min-width: 0; min-height: 44px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--field); padding: 6px 10px; font-size: 1rem; color: var(--ink); }
.desc p { color: var(--ink); line-height: 1.5; overflow-wrap: anywhere; }
.note { display: grid; gap: 4px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.note textarea { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); padding: 10px 12px; font-size: 1rem; color: var(--ink); resize: vertical; }
.note-add { justify-self: start; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }

/* jour par jour */
.dstrip { display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 2px 14px 4px; scrollbar-width: none; }
.dstrip::-webkit-scrollbar { display: none; }
.ds { position: relative; flex: none; width: 62px; display: grid; justify-items: center; gap: 1px; padding: 7px 2px 6px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); line-height: 1.1; }
.ds small { font-size: .72rem; color: var(--muted); text-transform: capitalize; }
.ds b { font-size: 1.35rem; }
.ds span { font-size: .66rem; color: var(--muted); max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds.has::after { content: ""; position: absolute; top: 6px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--saffron); }
.ds.today { border-color: var(--saffron); }
.ds.on { background: var(--night); border-color: var(--night); color: #fff; } .ds.on small, .ds.on span { color: rgba(255,255,255,.75); }
.dhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; text-align: center; }
.dhead > div { display: grid; } .dhead b { font-size: 1.25rem; } .dhead small { color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl-i { display: grid; grid-template-columns: 50px 16px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.tl-tm { display: grid; align-content: start; justify-items: end; padding-top: 14px; font-size: .9rem; line-height: 1.1; }
.tl-tm small { color: var(--muted); font-size: .75rem; }
.tl-dot { position: relative; }
.tl-dot::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.tl-dot::after { content: ""; position: absolute; left: 2px; top: 16px; width: 12px; height: 12px; border-radius: 50%; background: var(--saffron); border: 2px solid var(--paper); }
.k-trip .tl-dot::after { background: var(--night); } .k-stay .tl-dot::after { background: #DB4436; } .s-maybe .tl-dot::after { background: var(--maybe); } .k-place.s-go .tl-dot::after { background: var(--go); }
.tl-c { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center; margin: 5px 0; padding: 8px; border-radius: 16px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.05); min-width: 0; }
.tl-c > div { display: grid; min-width: 0; } .tl-c b { font-size: .98rem; line-height: 1.2; overflow-wrap: anywhere; } .tl-c small { color: var(--muted); font-size: .8rem; overflow-wrap: anywhere; }
.tl-ph { width: 52px; height: 52px; border-radius: 12px; } .tl-ph .fb-i { width: 22px; height: 22px; }
.tl-ic { width: 52px; height: 52px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; }
.tl-ic svg { width: 26px; height: 26px; fill: var(--night); }
html[data-theme="nuit"] .tl-ic svg { fill: var(--ink); }
.k-place { cursor: pointer; }
.free { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fr { position: relative; }
.fr-o { display: grid; gap: 6px; width: 100%; padding: 0; border: 0; background: none; text-align: left; }
.fr-ph { height: 96px; border-radius: 14px; } .fr-ph .fb-i { width: 28px; height: 28px; }
.fr-o b { font-size: .9rem; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fr-add { position: absolute; right: 6px; top: 58px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--go); color: #fff; display: grid; place-items: center; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.fr-add svg { width: 22px; height: 22px; }

/* trier */
.tstack { position: relative; height: calc(100dvh - var(--nav-h) - var(--safe-b) - var(--safe-t) - 262px); min-height: 300px; max-height: 560px; }
.tcard { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: var(--night-2); box-shadow: 0 14px 34px rgba(0,0,0,.22); touch-action: none; user-select: none; -webkit-user-select: none; transition: transform .22s ease, opacity .22s; }
.tcard.under { transform: scale(.95) translateY(10px); opacity: .7; }
.tc-img { position: absolute; inset: 0; }
.tc-img .fb-i { width: 70px; height: 70px; }
.tc-tx { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 4px; padding: 60px 18px 16px; color: #fff; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.82) 40%); }
.tc-tx small { opacity: .85; display: flex; align-items: center; flex-wrap: wrap; }
.tc-tx b { font-size: 1.6rem; line-height: 1.12; overflow-wrap: anywhere; }
.tc-tx .km { display: inline-flex; gap: 5px; align-items: center; font-size: .9rem; opacity: .9; }
.tc-tx p { font-size: .92rem; opacity: .92; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lnk.light { color: #fff; justify-self: start; padding: 4px 0; }
.tc-hint { position: absolute; top: 22px; z-index: 2; padding: 6px 14px; border-radius: 12px; border: 3px solid; font: 800 1.2rem var(--font-display); letter-spacing: .06em; opacity: 0; transition: opacity .12s; background: rgba(255,255,255,.85); }
.tc-hint.go { left: 18px; color: #23905F; transform: rotate(-12deg); } .tc-hint.no { right: 18px; color: #B4465C; transform: rotate(12deg); } .tc-hint.maybe { left: 50%; transform: translateX(-50%); color: #B7860B; top: auto; bottom: 46%; }
.tcard[data-hint="go"] .tc-hint.go, .tcard[data-hint="no"] .tc-hint.no, .tcard[data-hint="maybe"] .tc-hint.maybe, .out-go .tc-hint.go, .out-no .tc-hint.no, .out-maybe .tc-hint.maybe { opacity: 1; }
.tcard.out-go { transform: translateX(130%) rotate(18deg); opacity: 0; }
.tcard.out-no { transform: translateX(-130%) rotate(-18deg); opacity: 0; }
.tcard.out-maybe { transform: translateY(-120%); opacity: 0; }
.tbtns { display: flex; justify-content: center; gap: 22px; }
.tb { width: 66px; height: 66px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.14); }
.tb svg { width: 32px; height: 32px; }
.tb.go svg { fill: var(--go); } .tb.no svg { fill: var(--no); } .tb.maybe { width: 54px; height: 54px; align-self: center; } .tb.maybe svg { fill: var(--maybe); width: 26px; height: 26px; }
.tb:active { transform: scale(.94); }
.tfoot { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .88rem; }

/* infos */
.ilist { display: grid; gap: 10px; }
.icard { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: 0 2px 8px rgba(0,0,0,.05); }
.icard > div { display: grid; gap: 2px; min-width: 0; }
.icard small { color: var(--muted); font-size: .82rem; } .icard b { font-size: 1.05rem; overflow-wrap: anywhere; }
.icard > svg { width: 22px; height: 22px; fill: var(--muted); }
.ic-big { width: 44px; height: 44px; border-radius: 14px; background: var(--soft); display: grid; place-items: center; }
.ic-big svg { width: 24px; height: 24px; fill: var(--night); }
html[data-theme="nuit"] .ic-big svg { fill: var(--ink); }
.chips2 { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.chips2 em { font-style: normal; font-size: .76rem; padding: 2px 8px; border-radius: 999px; background: var(--soft); }
.icard.sync { grid-template-columns: 1fr; }
.icard.sync.ok { background: var(--go-soft); }
.ic-h { display: flex; gap: 12px; align-items: center; }
.ic-h > svg { width: 30px; height: 30px; fill: var(--go); flex: none; }
.icard.sync.off .ic-h > svg, .icard.sync.err .ic-h > svg { fill: var(--no); }
.ic-h > div { display: grid; }
.syncform { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.syncform input { min-width: 0; min-height: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--field); padding: 0 12px; font-size: 1rem; }
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.th { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); font-size: .8rem; font-weight: 600; }
.th.on { border-color: var(--saffron); box-shadow: 0 0 0 2px var(--saffron) inset; }
.sw { display: flex; } .sw i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--card); margin-left: -6px; } .sw i:first-child { margin-left: 0; }
.icard.full { margin-top: 6px; }

/* barre du bas */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(4, 1fr); height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0,0,0,.06); }
#nav a { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: .74rem; font-weight: 600; color: var(--muted); }
#nav a svg { width: 25px; height: 25px; fill: currentColor; }
#nav a.on { color: var(--night); }
html[data-theme="nuit"] #nav a.on { color: var(--saffron); }
#nav a.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--saffron); }
#nav em { position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--new); color: #fff; font: 700 .66rem/18px var(--font-body); font-style: normal; text-align: center; }
#nav em:empty { display: none; }

.toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + 12px); z-index: 80; max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--night); color: #fff; padding: 12px 16px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); font-size: .95rem; }
.toast[hidden] { display: none; }
.toast-act { border: 0; background: var(--saffron); color: var(--night); font-weight: 700; padding: 6px 12px; border-radius: 10px; }
#discBox, #content { display: none; }
@media (min-width: 700px) { .stg { height: 180px; } }
.tcard img { -webkit-user-drag: none; pointer-events: none; }
.scr.tri { gap: 12px; }

</style>
</head>

  else if (h === 'infos') M.scr = 'infos';
  else M.scr = 'etapes';
  if (M.sheet) { M.sheet = null; $('#sheet').hidden = true; document.body.classList.remove('noscroll'); }
  render(true);
}
window.addEventListener('hashchange', mroute);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && M.sheet) closeSheet(); });


/* ---------- synchro : pastille courte, et pas de rafraîchissement pendant une saisie ---------- */
function paintSync() {
  const [cls, label] = syncLabel();
  const short = cls === 'ok' ? 'En ligne' : cls === 'off' ? 'Pas en ligne' : cls === 'err' ? 'Hors ligne' : 'Synchro…';
  document.querySelectorAll('.syncdot').forEach(n => { n.className = 'syncdot ' + cls; n.title = label; const t = n.querySelector('span'); if (t) t.textContent = short; });
}
function renderSoon() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('input, textarea, select')) { pendingRender = true; return; }
  render();
}

loadLocal(); mroute(); syncSoon(300);

</script>
