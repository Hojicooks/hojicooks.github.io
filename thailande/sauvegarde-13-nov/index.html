<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>[Sauvegarde 13 nov.] Carnet Thaïlande</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
/* Idée : une appli de choix, pensée pour l'ordinateur. Barre latérale nuit d'Andaman pour naviguer,
   zone principale claire comme un carnet : à gauche la liste des lieux, à droite la carte numérotée. */
:root {
  --night: #0E2233;
  --night-2: #17324A;
  --paper: #F6F0E4;
  --card: #FFFFFF;
  --ink: #1E2833;
  --muted: #5F6B74;
  --line: #E4D9C5;
  --saffron: #E38A22;
  --go: #23905F;
  --go-soft: #E3F4EA;
  --no: #B4465C;
  --font-display: "Mitr", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Sarabun", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 20px; height: 20px; fill: currentColor; flex: none; }

.app { display: grid; grid-template-columns: 300px 1fr; min-height: 100%; }

/* ---------- barre latérale ---------- */
.side { background: var(--night); color: #F3EADB; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; }
.brand { padding: 0 10px 18px; }
.brand h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -.01em; color: #fff; }
.brand .thai { font-family: var(--font-display); font-weight: 300; color: #C9D6DF; font-size: 1rem; }
.brand p { margin: 8px 0 0; font-size: .92rem; color: #AFC0CC; }
.nav-sep { font-family: var(--font-display); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: #8FA6B6; padding: 14px 10px 4px; }
.nav { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; text-decoration: none; color: #E9E1D2; }
.nav:hover { background: var(--night-2); }
.nav[aria-current="page"] { background: #F6F0E4; color: var(--ink); }
.nav .badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: .95rem; background: var(--saffron); color: var(--night); }
.nav .badge.side-trip { background: transparent; border: 1.5px dashed var(--saffron); color: var(--saffron); }
.nav .badge.icon { background: rgba(255,255,255,.12); color: inherit; }
.nav[aria-current="page"] .badge.icon { background: var(--night); color: #fff; }
.nav .t { font-family: var(--font-display); font-weight: 400; line-height: 1.2; }
.nav .t small { display: block; font-family: var(--font-body); font-size: .78rem; opacity: .7; }
.nav .c { font-size: .8rem; text-align: right; font-variant-numeric: tabular-nums; opacity: .85; white-space: nowrap; }
.nav .c b { color: #6FD3A0; font-weight: 700; }
.nav[aria-current="page"] .c b { color: var(--go); }
.mini { height: 4px; border-radius: 4px; background: rgba(255,255,255,.14); grid-column: 2 / 4; overflow: hidden; margin-top: -4px; }
.nav[aria-current="page"] .mini { background: var(--line); }
.mini i { display: block; height: 100%; background: #4CC48A; border-radius: 4px; }
.side-foot { margin-top: auto; padding: 18px 10px 0; font-size: .8rem; color: #8FA6B6; }

/* ---------- zone principale ---------- */
.main { min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 10; background: rgba(246,240,228,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .in { display: flex; align-items: center; gap: 18px; padding: 14px 40px; flex-wrap: wrap; }
.topbar h2 { font-size: 1.35rem; }
.tally { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 12px; font-size: .9rem; background: var(--card); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.pill b { font-weight: 700; }
.pill.go b { color: var(--go); } .pill.no b { color: var(--no); }
.content { padding: 30px 40px 80px; max-width: 1560px; }

/* ---------- vue d'ensemble ---------- */
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 30px; }
.how > div { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start; }
.how .n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; background: var(--night); color: #fff; }
.how h3 { font-size: 1.1rem; }
.how p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.over { display: grid; grid-template-columns: minmax(360px, 460px) 1fr; gap: 28px; align-items: start; }
.over .mapbox { position: sticky; top: 90px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
.scard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-decoration: none; display: grid; transition: transform .2s, box-shadow .2s; }
.scard:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(30,40,51,.12); }
.scard canvas { width: 100%; height: 92px; display: block; }
.scard .b { padding: 14px 18px 16px; display: grid; gap: 6px; }
.scard .k { font-family: var(--font-display); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--saffron); font-weight: 500; }
.scard h3 { font-size: 1.3rem; }
.scard h3 span { font-weight: 300; color: var(--muted); font-size: .8em; margin-left: 6px; }
.scard p { margin: 0; color: var(--muted); font-size: .95rem; }
.bar { height: 8px; border-radius: 6px; background: #EFE7D8; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--go); } .bar .r { background: #E3B3BD; }
.scard .meta { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.scard .meta b { color: var(--go); }
.scard .go-btn { justify-self: start; margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); color: var(--night); font-size: .95rem; }

/* ---------- étape ---------- */
.banner { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: 22px; min-height: 170px; display: grid; align-items: end; }
.banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.banner .txt { position: relative; padding: 22px 28px; background: linear-gradient(90deg, rgba(14,34,51,.86) 0%, rgba(14,34,51,.55) 55%, rgba(14,34,51,0) 100%); color: #fff; display: grid; gap: 4px; }
.banner .k { font-family: var(--font-display); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #FFC67A; }
.banner h2 { font-size: 2.3rem; line-height: 1.05; }
.banner h2 span { font-weight: 300; font-size: .55em; color: #D7E2EA; margin-left: 10px; }
.banner p { margin: 0; color: #E6EEF3; max-width: 60ch; }
.lodging { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: #E6EEF3; margin-top: 6px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 16px; font-size: .95rem; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--night); color: #fff; }
.search { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; margin-left: auto; min-width: 260px; }
.search:focus-within { border-color: var(--saffron); }
.search input { border: 0; outline: none; font: inherit; font-size: .95rem; background: transparent; width: 100%; color: var(--ink); }
.search svg { color: var(--muted); }
.stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(380px, 40%); gap: 28px; align-items: start; }
.stage-grid .mapbox { position: sticky; top: 86px; }

.group-h { font-family: var(--font-display); font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
.group-h:first-child { margin-top: 0; }
.group-h i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.rows { display: grid; gap: 12px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: grid; grid-template-columns: 46px 1fr; gap: 16px; transition: border-color .2s, box-shadow .2s, background .2s; scroll-margin-top: 100px; }
.row.hot { border-color: var(--saffron); box-shadow: 0 0 0 3px rgba(227,138,34,.25); }
.row.is-go { background: var(--go-soft); border-color: #9FD6B8; }
.row.flash { animation: flash 1.3s ease; }
@keyframes flash { 30% { box-shadow: 0 0 0 4px var(--saffron); } }
.num { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; position: relative; }
.num svg { width: 24px; height: 24px; fill: #fff; }
.num b { position: absolute; top: -8px; left: -8px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; background: var(--night); color: #fff; font-size: .8rem; display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; border: 2px solid var(--card); }
.r-main { display: grid; gap: 4px; min-width: 0; }
.r-top { display: flex; gap: 12px; align-items: flex-start; }
.r-title { flex: 1; min-width: 0; }
.r-title h3 { font-size: 1.18rem; line-height: 1.25; overflow-wrap: anywhere; }
.r-cat { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; }
.r-desc { margin: 0; color: #3E4A54; overflow-wrap: anywhere; }
.r-acts { display: flex; gap: 8px; flex: none; }
.act { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 7px 14px; font-size: .92rem; border: 1.5px solid var(--line); background: #fff; white-space: nowrap; }
.act:hover { border-color: var(--muted); }
.act.go[aria-pressed="true"] { background: var(--go); border-color: var(--go); color: #fff; }
.act.go:hover { border-color: var(--go); }
.act.no:hover { border-color: var(--no); color: var(--no); }
.act:disabled { opacity: .5; cursor: not-allowed; }
.act svg { width: 18px; height: 18px; fill: currentColor; }
.r-links { display: flex; gap: 16px; align-items: center; font-size: .9rem; margin-top: 4px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: #2B6380; display: inline-flex; gap: 5px; align-items: center; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn svg { width: 16px; height: 16px; fill: currentColor; }
.mynote { background: #FFF7E6; border: 1px solid #F1D9A8; border-radius: 10px; padding: 8px 12px; font-size: .95rem; margin-top: 4px; white-space: pre-wrap; }
.mynote::before { content: "Notre note : "; font-weight: 700; }
.note-edit { display: grid; gap: 8px; margin-top: 6px; }
.note-edit textarea { width: 100%; min-height: 70px; resize: vertical; border: 1.5px solid var(--saffron); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: .95rem; }
.note-edit .btns { display: flex; gap: 8px; }
.empty { background: var(--card); border: 1px dashed var(--line); border-radius: 16px; padding: 22px; color: var(--muted); text-align: center; }

.removed { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 14px; }
.removed summary { cursor: pointer; font-family: var(--font-display); color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
.removed summary::-webkit-details-marker { display: none; }
.removed[open] summary svg { transform: rotate(180deg); }
.removed ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
.removed li { display: flex; align-items: center; gap: 12px; background: #F1EADC; border-radius: 12px; padding: 8px 12px; color: var(--muted); }
.removed li span { flex: 1; text-decoration: line-through; }

/* ---------- carte ---------- */
.mapbox { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px; }
.mapframe { border-radius: 14px; overflow: hidden; aspect-ratio: 1 / 1; background: #CFE6EE; }
.mapframe svg { width: 100%; height: 100%; display: block; }
.over .mapframe { aspect-ratio: 4 / 5; }
.maplegend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 6px 2px; font-size: .84rem; color: var(--muted); }
.maplegend span { display: inline-flex; align-items: center; gap: 6px; }
.maplegend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.land { fill: #EDE5D2; stroke: #B9AC90; }
.neigh { fill: #E2DCCB; stroke: #C9BFA8; opacity: .8; }
.grid { stroke: rgba(30,40,51,.07); fill: none; }
.route { fill: none; stroke: var(--saffron); stroke-linecap: round; }
.route.draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 2.6s .3s ease-in-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.mk { cursor: pointer; }
.mk .ring { fill: none; stroke: var(--go); opacity: 0; }
.mk.is-go .ring { opacity: 1; }
.mk.hot .ring { opacity: 1; stroke: var(--saffron); }
.mk text { font-family: var(--font-display); font-weight: 500; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk.dim { opacity: .18; }
.leader { stroke: rgba(30,40,51,.35); }
.hub circle { fill: var(--night); stroke: #fff; }
.hub text { font-family: var(--font-display); font-weight: 600; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.hub { cursor: pointer; }
.hub.hot circle { fill: var(--saffron); }
.hublabel { font-family: var(--font-display); font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: #fff; pointer-events: none; }
.lodge circle { fill: #fff; stroke: var(--night); }
.lodge path { fill: var(--night); }
.scale line { stroke: var(--ink); }
.scale text { font-family: var(--font-body); fill: var(--ink); }
.offnote { font-family: var(--font-body); fill: var(--muted); }
.dot { stroke: #fff; }
.dot.dim { opacity: .15; }

/* ---------- programme ---------- */
.prog { display: grid; gap: 22px; max-width: 980px; }
.prog-stage { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }
.prog-stage h3 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
.prog-stage h3 small { font-family: var(--font-body); font-weight: 400; font-size: .9rem; color: var(--muted); margin-left: auto; }
.prog-stage ol { margin: 12px 0 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.prog-stage li { display: grid; grid-template-columns: 14px 1fr; gap: 12px; align-items: baseline; }
.prog-stage li i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.prog-stage li small { color: var(--muted); display: block; }
.prog-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; padding: 10px 18px; font-family: var(--font-display); font-size: 1rem; text-decoration: none; }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn-dark { background: var(--night); color: #fff; }
.btn-light { background: var(--card); border: 1px solid var(--line); }
textarea.copy { width: 100%; min-height: 200px; border-radius: 12px; border: 1px solid var(--line); padding: 12px; font: inherit; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--night); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: .95rem; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.view { animation: fadein .35s ease; }
@keyframes fadein { from { transform: translateY(8px); } to { transform: none; } }


/* ---------- photos ---------- */
.row { grid-template-columns: 190px 1fr; padding: 0; overflow: hidden; gap: 0; }
.ph { position: relative; border: 0; padding: 0; margin: 0; display: block; width: 100%; height: 100%; min-height: 150px; cursor: zoom-in; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
.row:hover .ph img { transform: scale(1.05); }
.ph .fb { position: absolute; inset: 0; display: grid; place-items: center; }
.ph .fb svg { width: 54px; height: 54px; fill: rgba(255,255,255,.92); }
.ph .badge { position: absolute; top: 10px; left: 10px; min-width: 28px; height: 28px; padding: 0 7px; border-radius: 14px; background: var(--night); color: #fff; font-family: var(--font-display); font-weight: 500; font-size: .9rem; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.ph .cat { position: absolute; bottom: 10px; left: 10px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid #fff; }
.ph .cat svg { width: 16px; height: 16px; fill: #fff; }
.row .r-main { padding: 16px 20px 14px; gap: 6px; }
.r-foot { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 6px; }
.r-foot .r-acts { display: flex; gap: 8px; }
.r-foot .r-links { margin: 0 0 0 auto; }
.row.is-go .r-main h3::after { content: "  ✓ choisi"; color: var(--go); font-size: .8rem; font-family: var(--font-body); font-weight: 700; }
/* ---------- intro vue d'ensemble ---------- */
.intro { display: grid; grid-template-columns: 1fr auto; gap: 30px; align-items: center; background: var(--night); color: #F3EADB; border-radius: 22px; padding: 30px 34px; margin-bottom: 26px; position: relative; overflow: hidden; }
.intro .bg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
.intro > * { position: relative; }
.intro .k { font-family: var(--font-display); font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; color: #FFC67A; }
.intro h2 { font-size: 2.2rem; line-height: 1.1; margin: 6px 0 8px; color: #fff; }
.intro p { margin: 0; color: #D7E2EA; max-width: 60ch; }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.btn-saffron { background: var(--saffron); color: var(--night); }
.btn-outline { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.4); }
.ring { width: 150px; height: 150px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: .85rem; color: #D7E2EA; line-height: 1.2; }
.ring .lbl b { display: block; font-family: var(--font-display); font-size: 2rem; font-weight: 600; color: #fff; }
.scard .cover { width: 100%; height: 140px; object-fit: cover; display: block; }
.banner img.bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner { min-height: 230px; }
.tools .btn-disc { background: var(--saffron); color: var(--night); }
/* ---------- découverte ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(9,22,34,.94); display: grid; place-items: center; padding: 28px; }
.disc { width: min(1180px, 100%); height: min(720px, 100%); display: grid; grid-template-rows: auto 1fr auto; gap: 14px; color: #F3EADB; }
.disc-top { display: flex; align-items: center; gap: 14px; }
.disc-top h2 { font-size: 1.3rem; color: #fff; }
.disc-top .prog { flex: 1; height: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
.disc-top .prog i { display: block; height: 100%; background: var(--saffron); }
.disc-top .x { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: transparent; display: grid; place-items: center; color: #fff; }
.dcard { display: grid; grid-template-columns: 1.45fr 1fr; background: var(--paper); color: var(--ink); border-radius: 24px; overflow: hidden; min-height: 0; box-shadow: 0 30px 80px rgba(0,0,0,.45); transition: transform .32s cubic-bezier(.3,.7,.3,1), opacity .32s; }
.dcard.out-l { transform: translateX(-60px) rotate(-3deg); opacity: .0; }
.dcard.out-r { transform: translateX(60px) rotate(3deg); opacity: .0; }
.dcard.out-d { transform: translateY(40px); opacity: .0; }
.dphoto { position: relative; min-height: 0; background: var(--night); }
.dphoto img, .dphoto canvas, .dphoto .fb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dphoto .fb { display: grid; place-items: center; }
.dphoto .fb svg { width: 110px; height: 110px; fill: rgba(255,255,255,.9); }
.dphoto .credit { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 16px 10px; font-size: .75rem; color: #eee; background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.dphoto .credit a { color: #fff; }

.vpos svg { width: 18px; height: 18px; fill: currentColor; }
.vpos.ok { color: var(--go); font-weight: 600; }
.vdel { margin-left: auto; }
.basepin.other { background: #7C8B96; width: 30px; height: 30px; border-width: 2px; cursor: pointer; }
.basepin.other svg { width: 17px; height: 17px; }
.staypick { font: inherit; font-weight: 700; font-size: .92rem; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; background: #fff; max-width: 100%; }
@media (max-width: 980px) { .plist.tl li { grid-template-columns: 56px 54px 1fr; } }
.when.tm input { width: 100px; }
