<script>
/* Version hébergée : fiches, votes, commentaires et comptes dans Supabase. */
(function(){
  var sb=supabase.createClient("https://sonpigelysgbfvbeotgj.supabase.co","sb_publishable_yzD2ln5tGuEZZyYttiFCWA__bK-4psf");
  var CONTENT=["tips","money","vehicles","codes","wildlife","places"],ROWS={community:1,suggestions:1};
  var sess=sb.auth.getSession().then(function(r){return r.data.session}).catch(function(){return null});
  function me(){return sess.then(function(s){return s?s.user.id:null})}
  var subs={};function reg(k,f){(subs[k]=subs[k]||[]).push(f);f()}
  function emit(k){(subs[k]||[]).forEach(function(f){f()})}
  function fail(e){throw {code:e&&(e.code==="42501"||e.code==="PGRST301")?"invalid_argument":"error",message:e&&e.message}}
  function ok(k){return function(r){if(r.error)fail(r.error);if(k)emit(k);return r}}
  function now(){return new Date().toISOString()}
  function slug(d){var t=String(d.name||d.title||"fiche").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50)||"fiche";return t+"-"+Math.random().toString(36).slice(2,6)}
  function nodoc(){return {onSnapshot:function(cb){setTimeout(function(){cb({exists:false,data:function(){return null},metadata:{fromCache:false}})},0);return function(){}},set:function(){return Promise.reject({code:"error"})},delete:function(){return Promise.reject({code:"error"})}}}
  function rowDoc(table,id){return {
    onSnapshot:function(cb,err){reg(table,function(){sb.from(table).select("data").eq("user_id",id).maybeSingle().then(function(r){if(r.error){if(err)err(r.error);return}cb({exists:!!r.data,data:function(){return r.data?r.data.data:null},metadata:{fromCache:false}})})});return function(){}},
    set:function(d){return me().then(function(u){return u===id?sb.from(table).upsert({user_id:id,data:d,updated_at:now()}):sb.from(table).update({data:d,updated_at:now()}).eq("user_id",id)}).then(ok(table))},
    delete:function(){return Promise.reject({code:"error"})}}}
  function ficheDoc(col,id){return {
    onSnapshot:nodoc().onSnapshot,
    set:function(d){return sb.from("fiches").upsert({col:col,id:id,data:d,updated_at:now()}).then(ok("fiches:"+col))},
    delete:function(){return sb.from("fiches").delete().eq("col",col).eq("id",id).then(ok("fiches:"+col))}}}
  var db={
    collection:function(c){
      if(CONTENT.indexOf(c)>-1)return {
        onSnapshot:function(cb,err){reg("fiches:"+c,function(){sb.from("fiches").select("id,data").eq("col",c).then(function(r){if(r.error){if(err)err(r.error);return}cb({docs:r.data.map(function(x){return {id:x.id,data:function(){return x.data}}}),metadata:{fromCache:false}})})});return function(){}},
        add:function(d){var id=slug(d);return sb.from("fiches").insert({col:c,id:id,data:d}).then(ok("fiches:"+c)).then(function(){return {id:id}})},
        doc:function(id){return ficheDoc(c,id)}};
      if(ROWS[c])return {
        onSnapshot:function(cb,err){reg(c,function(){sb.from(c).select("user_id,data").then(function(r){if(r.error){if(err)err(r.error);return}cb({docs:r.data.map(function(x){return {id:x.user_id,data:function(){return x.data}}}),metadata:{fromCache:false}})})});return function(){}},
        doc:function(id){return rowDoc(c,id)}};
      var m=/^data\/users\/([0-9a-f-]{36})$/.exec(c);
      if(m)return {doc:function(){return rowDoc("user_state",m[1])},onSnapshot:function(){return function(){}}};
      return {onSnapshot:function(cb){cb({docs:[],metadata:{fromCache:false}});return function(){}},doc:nodoc,add:function(){return Promise.reject({code:"error"})}}},
    doc:function(path){var p=path.split("/");if(p.length===2&&CONTENT.indexOf(p[0])>-1)return ficheDoc(p[0],p[1]);if(p.length===2&&ROWS[p[0]])return rowDoc(p[0],p[1]);return nodoc()}};
  var user={
    id:me,
    canEdit:function(){return sess.then(function(s){return s?sb.rpc("is_admin").then(function(r){return !!r.data}):false})},
    profiles:function(ids){var o={};ids.forEach(function(i){o[i]={id:i,name:""}});return sb.from("profiles").select("user_id,name").in("user_id",ids).then(function(r){(r.data||[]).forEach(function(x){if(o[x.user_id])o[x.user_id].name=x.name});return o})}};
  window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="user"?user:null)}};
  /* adresse publique du site (liens de partage) + installation sur l'écran d'accueil */
  window.PLANQUE_SITE=location.origin+location.pathname.replace(/[^\/]*$/,"");
  var bip=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();bip=e});
  window.PLANQUE_INSTALL={can:function(){return !!bip},prompt:function(){if(!bip)return Promise.resolve(false);var e=bip;bip=null;e.prompt();return e.userChoice.then(function(c){return c&&c.outcome==="accepted"},function(){return false})}};
  if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){})});
  /* lien « mot de passe oublié » : on ouvre Mon profil pour choisir le nouveau mot de passe */
  sb.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY"){window.PLANQUE_RECOVERY=true;location.hash="#profil"}});
  if(/type=recovery/.test(location.hash))window.PLANQUE_RECOVERY=true;
  function aerr(r){if(r.error)throw r.error;return r}
  window.PLANQUE_AUTH={
    signUp:function(email,pw){return sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}).then(aerr).then(function(r){
      /* compte déjà existant : Supabase renvoie un utilisateur sans identité */
      if(r.data.user&&r.data.user.identities&&r.data.user.identities.length===0)throw {code:"user_already_exists"};
      return {session:!!r.data.session}})},
    signInPw:function(email,pw){return sb.auth.signInWithPassword({email:email,password:pw}).then(aerr)},
    resetPw:function(email){return sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}).then(aerr)},
    setPw:function(pw){return sb.auth.updateUser({password:pw}).then(aerr)},
    signOut:function(){return sb.auth.signOut()},
    setName:function(n){return me().then(function(u){return sb.from("profiles").upsert({user_id:u,name:n,updated_at:now()})}).then(function(r){if(r.error)throw r.error})},
    deleteAccount:function(){return sb.rpc("delete_my_account").then(function(r){if(r.error)throw r.error;return sb.auth.signOut({scope:"local"})})}};
  /* rafraîchir ce que font les autres joueurs */
  setInterval(function(){if(!document.hidden)emit("community")},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){emit("community");CONTENT.forEach(function(c){emit("fiches:"+c)})}});
})();
</script>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: app compagnon à une main — recherche collée en haut, navigation en bas, cartes empilées, fiches en panneau qui monte du bas. Thème nuit unique, choisi pour jouer le soir à côté de la console. */
:root{
  --bg:#0c121c; --card:#141d2b; --card2:#1b2638; --line:#26344a;
  --fg:#eef3fa; --mute:#8d9cb3; --dim:#5f6f88;
  --accent:#ff5d4f; --accent-fg:#1d0806; --teal:#33d1bc; --gold:#ffc35a; --cold:#5aa9ff;
  --ok:#4fd28a; --warn:#ffbe55; --bad:#ff6378;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --navh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.isteps{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:10px}.isteps li{background:var(--card2);border-radius:12px;padding:11px 13px;line-height:1.45}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:760px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 90px)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:grid;gap:10px}
.toprow{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:19px;color:var(--fg);text-decoration:none}
.logo i{width:11px;height:11px;border-radius:3px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 12px var(--accent)}
.logo small{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.topbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.admin{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);border:1px solid var(--teal);border-radius:999px;padding:3px 9px}
.iconbtn{position:relative;width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);text-decoration:none}
.iconbtn b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:11px;display:grid;place-items:center}
.sbox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:46px;color:var(--mute)}
.sbox:focus-within{border-color:var(--teal)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;color:var(--fg)}
.sbox button{color:var(--mute);display:grid;place-items:center;width:28px;height:28px}

/* Navigation du bas */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
.nav a{display:grid;place-items:center;align-content:center;gap:3px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:600}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"] svg{color:var(--accent)}

/* Blocs communs */
.sec{display:grid;gap:10px;margin-top:20px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sech h2{font-family:var(--display);font-size:17px;margin:0}
.sech a,.sech button{font-size:13px;color:var(--teal);text-decoration:none;font-weight:600}
.muted{color:var(--mute)}
.notice{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--mute);border:1px solid var(--line)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Accueil */
.countdown{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,var(--card)),color-mix(in srgb,var(--teal) 18%,var(--card)));border:1px solid var(--line);margin-top:4px}
.countdown small{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.countdown b{font-family:var(--display);font-size:18px}
.countdown .num{font-size:22px;letter-spacing:.02em}
.situ{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.situ button{display:grid;gap:8px;justify-items:start;align-content:start;text-align:left;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:88px}
.situ button svg.i{width:26px;height:26px}
.situ button b{font-size:14px;line-height:1.25}
.situ .s1 svg{color:var(--bad)} .situ .s2 svg{color:var(--ok)} .situ .s3 svg{color:var(--gold)}
.situ .s4 svg{color:var(--teal)} .situ .s5 svg{color:var(--accent)} .situ .s6 svg{color:var(--cold)}
@media (max-width:380px){.situ{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cdline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute);margin-top:2px}
.cdline .num{color:var(--fg);font-size:14px}
.more{justify-self:center;height:40px;padding:0 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--mute)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-14px;padding:2px 14px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.must{flex:0 0 min(78%,300px);scroll-snap-align:start;display:grid;gap:8px;align-content:start;text-align:left;background:linear-gradient(155deg,color-mix(in srgb,var(--accent) 26%,var(--card)),var(--card) 65%);border:1px solid var(--line);border-radius:16px;padding:14px}
.must .k{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.must b{font-size:16px;line-height:1.3}
.must span.t{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.hl{display:grid;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;align-content:start}
.hl .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute)}
.hl .big{font-family:var(--mono);font-size:24px;line-height:1.1}
.hl b{font-size:15px}
.prog{display:grid;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.prog .tot{display:flex;align-items:baseline;gap:8px}
.prog .tot .num{font-size:28px}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
.meter .lbl{width:88px;flex:none}
.meter .bar{flex:1;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}

/* Plus */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{display:grid;gap:8px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);text-align:left;position:relative}
.tile svg.i{width:26px;height:26px;color:var(--teal)}
.tile b{font-size:15px}
.tile small{color:var(--mute);font-size:12.5px}
.tile .cnt{position:absolute;top:12px;right:12px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.tile .cnt.hot{color:var(--accent-fg);background:var(--accent);border-radius:8px;padding:1px 7px}

/* Filtres en puces */
.chips{display:flex;gap:6px;overflow-x:auto;margin-inline:-14px;padding:0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}
.pagehead{display:grid;gap:10px;margin-top:6px}
.pagehead h1{font-family:var(--display);font-size:22px;margin:0}
.pagehead p{margin:0;font-size:13.5px}

/* Cartes de liste */
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;text-align:left;width:100%;position:relative}
.item:active{transform:scale(.99)}
.item.prio{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.item .t{grid-column:1;font-weight:700;font-size:15.5px;line-height:1.3;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .r{grid-row:1;grid-column:2;align-self:start;text-align:right;display:grid;gap:2px;justify-items:end}
.item .r .num{font-size:17px}
.item .r small{font-size:11.5px;color:var(--mute)}
.dt{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim);line-height:1;padding:3px 6px;border-radius:6px;background:var(--card2);white-space:nowrap}
.dt.fresh{color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--card))}
.item .r .dt+*{margin-top:4px}
.tag.when{font-variant-numeric:tabular-nums}
.tag.when.fresh{color:var(--teal)}
.item .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.item .sub{grid-column:1/-1;font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.item .subel{grid-column:1/-1}
.item.pic{grid-template-columns:48px 1fr auto}
.item.pic .r{grid-column:3}
.item.pic .sub,.item.pic .m,.item.pic .subel{grid-column:2/-1}
.item.pic .t{grid-column:2}
.thumb{grid-row:1/5;grid-column:1;width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--tc,var(--mute)) 16%,var(--card));display:grid;place-items:center;overflow:hidden;align-self:start}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg.i{width:28px;height:28px;color:inherit;stroke-width:1.7}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:7px;background:var(--card2);color:var(--mute);font-size:12px;font-weight:600;white-space:nowrap}
.tag svg.i{width:13px;height:13px}
.tag.red{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.tag.green{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.tag.gold{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--card))}
.tag.ex{color:var(--dim);background:transparent;border:1px dashed var(--line)}
.tag.prio{color:var(--accent-fg);background:var(--accent)}
.tag.new{color:var(--bg);background:var(--teal)}
.temp{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:7px;font-family:var(--mono);font-size:12.5px;font-weight:600;border:1px solid currentColor}
.lvl{display:inline-flex;gap:2px}
.lvl i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.lvl i.on{background:currentColor}
.empty{padding:30px 16px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:16px}
.group{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:10px 2px 0}

/* Ligne d'infos discrète sous une carte, squelette de chargement, suggestions de recherche */
.item .mt{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:12.5px;color:var(--dim);font-weight:500}
.item.pic .mt{grid-column:2/-1}
.item .mt span{display:inline-flex;align-items:center;gap:4px}
.item .mt svg.i{width:13px;height:13px}
.item .mt .deg{font-family:var(--mono);font-weight:600}
.sk{height:84px;border-radius:16px;background:linear-gradient(100deg,var(--card) 40%,var(--card2) 50%,var(--card) 60%);background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.qsugg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center;margin-inline:-14px;padding:0 14px}
.qsugg::-webkit-scrollbar{display:none}
.qsugg small{flex:none;font-size:12px;color:var(--dim);font-weight:600}

/* Vidéo dans une fiche */
.vid{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.vid:hover{border-color:var(--mute)}
.vid .play{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.vid .play svg{fill:currentColor}
.vid .vt{display:grid;gap:2px;min-width:0}
.vid .vt b{font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .vt small{font-size:12.5px;color:var(--mute)}
.vid > svg{color:var(--mute)}
.vsum{display:grid;gap:4px;padding:2px 2px 0}
.vsum small{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.vsum p{margin:0;font-size:14.5px;line-height:1.55;color:var(--fg)}
.credit{margin:-10px 2px 0;font-size:11.5px;color:var(--dim);text-align:right}
.sugg img.shot{width:100%;max-width:320px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line)}

/* Carte */
.mapwrap{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a1626;margin-top:12px}
.mapwrap svg{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.mapwrap.placing svg{cursor:crosshair}
.mapwrap .maptag{position:absolute;right:10px;top:10px;max-width:60%;text-align:right;font-size:11px;font-weight:600;color:var(--mute);background:color-mix(in srgb,var(--bg) 75%,transparent);padding:3px 8px;border-radius:7px;pointer-events:none}
.mapwrap .back{position:absolute;top:10px;left:10px;height:36px;padding:0 12px;border-radius:11px;background:color-mix(in srgb,var(--bg) 85%,transparent);border:1px solid var(--line);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.mk{cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.placebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--teal) 14%,var(--card));border:1px solid var(--teal);font-size:14px}

/* Codes manette */
.combo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.btnk{min-width:28px;height:28px;padding:0 6px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:inline-grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:700}
.btnk.round{border-radius:50%;width:28px;padding:0}

/* Équipement */
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px dashed var(--line);min-height:58px;text-align:left}
.slot.on{border-style:solid;border-color:color-mix(in srgb,var(--teal) 50%,var(--line))}
.slot small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.slot b{font-size:14px}

/* Comparateur */
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
table.cmp{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
table.cmp th,table.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp thead th{font-family:var(--display);font-size:15px}
table.cmp tbody th{font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
table.cmp tr:last-child td,table.cmp tr:last-child th{border-bottom:0}
table.cmp td.best{color:var(--ok);font-weight:700}

/* Panneau fiche : en-tête fixe qu'on peut glisser vers le bas, contenu qui défile dessous */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.62);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease-out;transition:background .18s ease}
@keyframes fadein{from{background:rgba(3,6,12,0)}}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
.scrim.still,.scrim.still .sheet{animation:none}
.scrim.closing{background:rgba(3,6,12,0);pointer-events:none}
.sheet{width:100%;max-width:760px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);overflow:hidden;animation:up .24s cubic-bezier(.2,.8,.2,1);transition:transform .18s ease}
.scrim.closing .sheet{transform:translateY(110%)!important}
.shd{flex:none;display:grid;gap:8px;padding:8px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);touch-action:none;cursor:grab;user-select:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.shead{display:flex;gap:8px;align-items:center}
.shead > div{flex:1;min-width:0}
.shead h2{font-family:var(--display);font-size:20px;margin:1px 0 0;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.shead .k{font-size:12px;font-weight:600;color:var(--mute)}
.x{width:38px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--fg);cursor:pointer}
.x.on{color:var(--gold)}
.x.on svg{fill:var(--gold)}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;gap:16px;align-content:start;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sbody > *{min-width:0}
.blk{display:grid;gap:10px}
.blk > h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.taglist{display:flex;gap:6px;flex-wrap:wrap}
.hero{width:100%;height:108px;border-radius:16px;background:radial-gradient(circle at 50% 130%,color-mix(in srgb,var(--tc,var(--accent)) 34%,var(--bg)),var(--bg) 72%);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.hero.photo{height:auto;aspect-ratio:16/9;max-height:280px;max-width:100%}
.hero img{width:100%;height:100%;object-fit:cover}
.hero svg.i{width:auto;height:70%;color:inherit;stroke-width:1.2}
.hero.slim{height:72px}
.hero.slim svg.i{height:56%;stroke-width:1.5}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px;min-width:0;align-content:start}
.stat.wide{grid-column:1/-1}
.stat small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stat b{font-size:15px;overflow-wrap:anywhere}
.stat b.num{font-family:var(--mono);font-size:18px}
.unknown{margin:0;font-size:13px;color:var(--mute)}
.unknown b{color:var(--fg);font-weight:600}
.prose{display:grid;gap:10px;font-size:15px;line-height:1.55}
.prose p{margin:0}
.prose.lead p{color:var(--mute)}
.prose.lead p:first-child{color:var(--fg);font-size:16.5px;font-weight:500}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:9px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--accent)}
.voter{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--bg);border:1px solid var(--line)}
.voter .q{flex:1;min-width:0;display:grid;gap:2px}
.voter .q b{font-size:14.5px}
.voter .q small{font-size:12.5px;color:var(--mute)}
.vgrp{display:flex;align-items:center;gap:2px;background:var(--card2);border-radius:12px;padding:3px;flex:none}
.vgrp button{width:40px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--mute)}
.vgrp button[aria-pressed="true"].up{background:var(--accent);color:var(--accent-fg)}
.vgrp button[aria-pressed="true"].down{background:var(--cold);color:var(--bg)}
.vgrp .deg{font-family:var(--mono);font-size:15px;min-width:50px;text-align:center}
.actrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px}
.pill[aria-pressed="true"]{background:var(--teal);color:var(--bg)}
.comments{display:grid;gap:10px}
.cm{display:grid;grid-template-columns:32px 1fr;gap:10px}
.cm .av{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mute);overflow:hidden}
.cm .av img{width:100%;height:100%;object-fit:cover}
.cm .b{background:var(--bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;min-width:0}
.cm .who{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:3px}
.cm .who b{color:var(--fg);font-weight:600}
.cm p{margin:0;font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.cm .del{color:var(--bad);font-size:12px;font-weight:600;margin-left:6px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;min-height:44px;max-height:140px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;color:var(--fg)}
.composer button{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;flex:none}
.adminrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}.sheet{max-width:600px;max-height:86vh;border-radius:22px;border-bottom:1px solid var(--line)}.grab{display:none}.shd{cursor:auto;padding-top:14px}}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute)}
.foot a{color:var(--teal)}
.linkbtn{color:var(--teal);font-weight:600;font-size:13px}
.btn{height:44px;padding:0 18px;border-radius:12px;font-weight:700;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:var(--card2);color:var(--fg)}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn:disabled{opacity:.5}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.fabs{position:fixed;right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 14px);z-index:24;display:flex;justify-content:flex-end;gap:8px;pointer-events:none}
.fab{pointer-events:auto;height:50px;padding:0 18px;border-radius:16px;background:var(--accent);color:var(--accent-fg);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab.alt{background:var(--teal);color:var(--bg)}
form.edit{display:grid;gap:12px}
form.edit label{display:grid;gap:5px;font-size:13px;color:var(--mute)}
form.edit input,form.edit select,form.edit textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);width:100%;font-size:16px}
form.edit textarea{min-height:110px;resize:vertical}
form.edit label.inline{display:flex;gap:10px;align-items:center;color:var(--fg);font-size:15px}
form.edit label.inline input{width:22px;height:22px}
.imgpick{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.imgpick img{width:96px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgpick label.btn{display:inline-flex;align-items:center;cursor:pointer}
.sugg{display:grid;gap:8px;padding:13px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sugg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.sugg .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 76px);z-index:60;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Passe de sobriété : dans les listes, seuls « Essentiel » et « Nouveau » restent des pastilles ; le reste devient une ligne de texte */
.item.prio{border-color:var(--line)}
.item .m{gap:3px 12px}
.item .m .tag{background:none!important;padding:0;height:auto;font-weight:500;font-size:12.5px;border:0}
.item .m .tag.prio,.item .m .tag.new{padding:0 8px;height:20px;font-weight:700;font-size:11.5px}
.item .m .tag.prio{background:var(--accent)!important}
.item .m .tag.new{background:var(--teal)!important}
.item .m .dot{display:none}
.item{transition:border-color .15s,transform .1s}
.item:hover{border-color:var(--dim)}
/* Raccourcis : icône dans une pastille, comme les fiches */
.situ .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 16%,var(--card))}
.situ .si svg.i{width:20px;height:20px;color:inherit}
.situ .s1 .si{color:var(--bad)} .situ .s2 .si{color:var(--ok)} .situ .s3 .si{color:var(--gold)} .situ .s4 .si{color:#ff8ad8} .situ .s5 .si{color:var(--accent)} .situ .s6 .si{color:var(--cold)}
.situ button{transition:border-color .15s,transform .1s}
.situ button:hover{border-color:var(--dim)}
.situ button:active{transform:scale(.97)}
.cdline{background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 20%,var(--card)),var(--card) 55%,color-mix(in srgb,var(--teal) 14%,var(--card)));color:var(--fg)}
/* Navigation : onglet actif marqué par une pastille */
.nav a svg.i{box-sizing:content-box;padding:4px 16px;border-radius:999px;transition:background .15s}
.nav a[aria-current="page"] svg.i{background:color-mix(in srgb,var(--accent) 18%,transparent)}
/* Changement d'écran en douceur */
#view.enter{animation:enter .18s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Accueil épuré, profil, bienvenue */
.hello{display:grid;gap:2px;margin-top:6px}
.hello h1{font-family:var(--display);font-size:22px;margin:0;line-height:1.2}
.hello p{margin:0;font-size:13.5px;color:var(--mute)}
.sech .tog{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.sech .tog button{height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mute)}
.sech .tog button[aria-pressed="true"]{background:var(--card2);color:var(--fg)}
.list.compact .item .sub{display:none}
.list.compact .item{padding:11px 12px}
.list.compact .item .t{-webkit-line-clamp:1}
.avatar{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-weight:700;overflow:hidden;text-decoration:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-top:10px}
.who .avatar{width:56px;height:56px;border-radius:18px;font-size:22px;flex:none}
.who b{font-size:17px;display:block}
.who small{color:var(--mute);font-size:13px}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat{display:grid;gap:2px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--fg);text-align:left}
.pstat b{font-family:var(--mono);font-size:20px}
.pstat small{font-size:12px;color:var(--mute)}
.wl{display:grid;gap:14px}
.wl > div{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.wl .si{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,currentColor 16%,var(--card))}
.wl b{display:block;font-size:15px}
.wl small{color:var(--mute);font-size:13.5px}
/* Illustrations d'ambiance (dessins originaux) */
.hero{position:relative;height:124px}
.hero.slim{height:124px}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .badge{position:absolute;left:10px;bottom:10px;width:40px;height:40px;border-radius:12px;background:rgba(10,15,24,.72);backdrop-filter:blur(4px);display:grid;place-items:center}
.hero .badge svg.i{width:22px;height:22px;stroke-width:1.8}
.banner{position:relative;height:132px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.banner .scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner .txt{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 12px;background:linear-gradient(to top,rgba(8,12,20,.92),rgba(8,12,20,0));display:grid;gap:1px}
.banner h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.2;color:#fff}
.banner p{margin:0;font-size:13px;color:#c9d3e3}

.banner.big{height:auto}

    db=v[0];user=v[1];assets=v[2];
    if(!db){dbState="none";render();return null}
    return (user?user.id():Promise.resolve(null)).then(function(id){uid=id;return user?user.canEdit():false}).then(function(ok){
      isAdmin=!!ok;document.getElementById("adminFlag").hidden=!ok;
      if(user&&uid)user.profiles([uid]).then(function(ps){var p=ps[uid]||{};me={name:p.name||"",avatarUrl:p.avatarUrl||""};drawAvatar(document.getElementById("profBtn"));rerender()}).catch(function(){});
      startProfileSync();
      var pending=ORDER.length,timer=setTimeout(function(){if(dbState==="wait"){dbState="slow";render()}},10000);
      ORDER.forEach(function(m){var col=MODS[m].col,first=true;
        db.collection(col).onSnapshot(function(s){
          data[col]=s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
          if(!s.metadata.fromCache)LS.set("c_"+col,data[col]);
          if(first&&!s.metadata.fromCache){first=false;if(--pending<=0){clearTimeout(timer);dbState="ok"}}
          rerender();
          if(pendingOpen&&pendingOpen.m===m&&data[col].some(function(x){return x.id===pendingOpen.id})){var po=pendingOpen;pendingOpen=null;openDetail(po.m,po.id)}
        },function(){clearTimeout(timer);dbState="err";render()})});
      db.collection("community").onSnapshot(function(s){comm={};s.docs.forEach(function(d){comm[d.id]=d.data()});recompute();rerender();refreshOpenSheet()},function(){});
      if(isAdmin)db.collection("suggestions").onSnapshot(function(s){sugg={};s.docs.forEach(function(d){sugg[d.id]=d.data()});rerender()},function(){});
      else if(uid)db.doc("suggestions/"+uid).onSnapshot(function(s){if(s.exists)sugg[uid]=s.data()},function(){});
      render();
    });
  }).catch(function(){dbState="none";render()});
} else {dbState="none";render()}
})();
</script>

</html>
